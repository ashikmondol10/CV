<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10233F">
  <title>Page not found | Martin Ashik</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Styles are inline so this page still looks right at any URL depth on GitHub Pages -->
  <style>
    :root { --navy:#10233F; --gold:#C6A15B; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--navy); color: rgba(255,255,255,.88); line-height: 1.6;
    }
    main { max-width: 32rem; border-left: 3px solid var(--gold); padding-left: 1.5rem; }
    h1 { margin: 0 0 .75rem; color: #fff; font-size: clamp(1.8rem, 6vw, 2.5rem); letter-spacing: -.02em; }
    p { margin: 0 0 1.5rem; }
    a.btn {
      display: inline-block; padding: .75rem 1.25rem; border-radius: 6px; font-weight: 600;
      background: var(--gold); color: var(--navy); text-decoration: none;
    }
    a.btn:hover { background: #D6B374; }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you tried to open does not exist or has moved. You can return to the home page to see Martin Ashik's profile and download his CV.</p>
    <a class="btn" id="home-link" href="index.html">Go to the home page</a>
  </main>
  <script>
    // On GitHub Pages project sites (username.github.io/repo/) the site root is /repo/.
    // On a custom domain the site root is /. This keeps the link working from any URL depth.
    (function () {
      var link = document.getElementById('home-link');
      var base = '/';
      if (/\.github\.io$/i.test(location.hostname)) {
        var first = location.pathname.split('/')[1];
        if (first) base = '/' + first + '/';
      }
      link.setAttribute('href', base);
    })();
  </script>
</body>
</html>
